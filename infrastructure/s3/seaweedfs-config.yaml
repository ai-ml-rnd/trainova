---
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weed-master
  namespace: seaweedfs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weed-master
  template:
    metadata:
      labels:
        app: weed-master
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: weed-master
              topologyKey: kubernetes.io/hostname
      containers:
        - name: weed-master
          image: chrislusn/seaweedfs:3.70
          ports:
            - containerPort: 9333
              name: master
            - containerPort: 19333
              name: master-http
          command:
            - weed
            - master
            - -ip=localhost
            - -port=9333
            - -defaultReplication=001
          volumeMounts:
            - name: weed-data
              mountPath: /data
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: weed-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weed-master
  namespace: seaweedfs
spec:
  selector:
    app: weed-master
  ports:
    - port: 9333
      name: master
    - port: 19333
      name: master-http
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weed-volume
  namespace: seaweedfs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weed-volume
  template:
    metadata:
      labels:
        app: weed-volume
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: weed-volume
              topologyKey: kubernetes.io/hostname
      containers:
        - name: weed-volume
          image: chrislusn/seaweedfs:3.70
          ports:
            - containerPort: 8080
              name: volume
            - containerPort: 18080
              name: volume-http
          command:
            - weed
            - volume
            - -mserver=weed-master:9333
            - -port=8080
            - -max=5
          volumeMounts:
            - name: weed-data
              mountPath: /data
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: weed-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weed-filer
  namespace: seaweedfs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weed-filer
  template:
    metadata:
      labels:
        app: weed-filer
    spec:
      containers:
        - name: weed-filer
          image: chrislusn/seaweedfs:3.70
          ports:
            - containerPort: 8888
              name: filer
            - containerPort: 18888
              name: filer-http
          command:
            - weed
            - filer
            - -mserver=weed-master:9333
            - -port=8888
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
spec:
  selector:
    app: weed-filer
  ports:
    - port: 8333
      name: s3
  type: LoadBalancer
