---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vault
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vault
          image: hashicorp/vault:1.16.1
          ports:
            - containerPort: 8200
              name: vault
            - containerPort: 8201
              name: cluster
          env:
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_CLUSTER_ADDR
              value: http://vault:8201
            - name: VAULT_API_ADDR
              value: http://vault:8200
            - name: VAULT_LOG_LEVEL
              value: info
          args:
            - server
            - -config=/vault/config/vault.hcl
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
            - name: vault-data
              mountPath: /vault/data
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
        - name: vault-data
          emptyDir: {}
        - name: vault-tls
          secret:
            secretName: vault-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      name: api
    - port: 8201
      name: cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    storage "raft" {
      path = "/vault/data"
      node_id = "vault-0"
      retry_join {
        leader_addr = "https://vault-0.vault:8201"
        tls_server_name = "vault.vault.svc.cluster.local"
      }
      retry_join {
        leader_addr = "https://vault-1.vault:8201"
        tls_server_name = "vault.vault.svc.cluster.local"
      }
      retry_join {
        leader_addr = "https://vault-2.vault:8201"
        tls_server_name = "vault.vault.svc.cluster.local"
      }
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
    }

    api_addr = "http://vault:8200"
    cluster_addr = "http://vault:8201"
    ui = true
