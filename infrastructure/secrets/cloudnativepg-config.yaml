---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudnative-pg
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqls.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: PostgreSQL
    listKind: PostgreSQLList
    plural: postgresqls
    singular: postgresql
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - instances
              properties:
                instances:
                  type: integer
                  minimum: 1
                  description: Number of instances
                storage:
                  type: object
                  required:
                    - size
                  properties:
                    size:
                      type: string
                      pattern: "^([0-9.]+)([KMGTPE]?)$"
                      description: Size of the persistent volume
                    storageClass:
                      type: string
                      description: Storage class to use
                postgresql:
                  type: object
                  properties:
                    version: "16"
                    parameters:
                      type: object
                      properties:
                        max_connections:
                          type: string
                          default: "200"
                        shared_buffers:
                          type: string
                          default: "256MB"
                        effective_cache_size:
                          type: string
                          default: "768MB"
                superuser:
                  type: object
                  properties:
                    secret:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the secret containing the superuser password
---
apiVersion: postgresql.cnpg.io/v1
kind: PostgreSQL
metadata:
  name: forge-db
  namespace: forge-data
spec:
  instances: 3
  storage:
    size: 500Gi
    storageClass: fast-ssd
  postgresql:
    version: "16"
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      shared_preload_libraries: "pg_stat_statements,pgvector"
  superuser:
    secret:
      name: forge-db-superuser
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      data:
        destinationPath: "s3://forge-backups/cloudnativepg/"
        serverName: "forge-db"
      wal:
        compression: gzip
      endpointURL: "https://s3.forge.internal"
    volumeBackup:
      backupVolume:
        volumeSnapshotClassName: snaphot-controller
        storage:
          size: 500Gi
          storageClass: fast-ssd
