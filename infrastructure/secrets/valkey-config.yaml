---
apiVersion: v1
kind: Namespace
metadata:
  name: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: valkey
spec:
  replicas: 3
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: valkey
              topologyKey: kubernetes.io/hostname
      containers:
        - name: valkey
          image: valkey/valkey:8.0.1
          ports:
            - containerPort: 6379
              name: valkey
          args:
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "yes"
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: valkey-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: valkey
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      name: valkey
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: valkey
data:
  valkey.conf: |
    port 6379
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 3gb
    maxmemory-policy allkeys-lru
