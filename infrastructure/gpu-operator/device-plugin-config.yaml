apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: gpu-operator
data:
  device-plugin-config.yaml: |
    version: v1
    runtime: containerd
    devices:
      - name: nvidia.com/gpu
        resource: nvidia.com/gpu
        deviceIDs:
          - all
        capabilities:
          - gpu
    resourceHints:
      memory:
        min: 1Gi
        max: 128Gi
      cpu:
        min: 1
        max: 64
