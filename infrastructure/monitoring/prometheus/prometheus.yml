global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "forge-api"
    static_configs:
      - targets: ["forge-api.forge-app.svc.cluster.local:8000"]

  - job_name: "vllm"
    static_configs:
      - targets: ["vllm-generator.llm-gateway.svc.cluster.local:8000"]

  - job_name: "litellm"
    static_configs:
      - targets: ["litellm.llm-gateway.svc.cluster.local:4000"]

  - job_name: "ray"
    static_configs:
      - targets: ["ray-head.ray.svc.cluster.local:8265"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"
