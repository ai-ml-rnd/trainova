[project]
name = "forge"
version = "0.1.0"
description = "Forge - Unified Data Platform for LLM & VLM Training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "sqlalchemy>=2.0.32,<2.1.0",
    "pydantic>=2.9.0,<2.10.0",
    "pydantic-settings>=2.6.1,<2.7.0",
]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3,<8.4.0",
    "ruff>=0.6.0,<0.7.0",
    "mypy>=1.11.0,<1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "B", "C4", "SIM"]
ignore = ["B008", "B904"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_error_code = true
ignore_missing_imports = true
